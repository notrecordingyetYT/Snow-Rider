<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow Rider 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b1329; font-family: sans-serif; user-select: none; }
        #score-board { position: absolute; top: 25px; left: 25px; color: #ffffff; font-size: 28px; font-weight: 900; text-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        #score-board span { color: #00d2ff; }
        #controls-tip { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.7); font-size: 15px; background: rgba(0,0,0,0.4); padding: 8px 20px; border-radius: 20px; }
        #screen-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 19, 41, 0.85); backdrop-filter: blur(4px); justify-content: center; align-items: center; flex-direction: column; cursor: pointer; }
        #overlay-title { color: #ff3366; font-size: 64px; font-weight: 900; }
        #btn-restart { background: linear-gradient(135deg, #00d2ff, #0066ff); color: white; border: none; padding: 15px 40px; font-size: 20px; font-weight: bold; border-radius: 30px; }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <div id="score-board">SCORE: <span id="scoreVal">0</span></div>
    <div id="controls-tip">Sturen: <b>A / D</b> | Springen: <b>Spatiebalk</b></div>
    <div id="screen-overlay" onclick="resetGame()"><div id="overlay-title">CRASH!</div><button id="btn-restart">HIER KLIKKEN OM OPNIEUW TE STARTEN</button></div>
    <script>
        let scene, camera, renderer, playerGroup, hill;
        let obstacles = []; let score = 0; let gameOver = false; let speed = 0.8;
        const sideSpeed = 0.26; const hillWidth = 40; const hillLength = 3000; const hillAngle = -Math.PI / 3;
        let isJumping = false; let velocityY = 0; const gravity = -0.016; const jumpForce = 0.36;
        const keys = { ArrowLeft: false, ArrowRight: false, a: false, d: false, ' ': false };
        function initEngine() {
            scene = new THREE.Scene(); scene.background = new THREE.Color(0xd0e7ff); scene.fog = new THREE.FogExp2(0xd0e7ff, 0.012);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true; document.body.appendChild(renderer.domElement);
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65); scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.85); dirLight.position.set(15, 45, 25); scene.add(dirLight);
            const hillGeometry = new THREE.PlaneGeometry(hillWidth, hillLength);
            const hillMaterial = new THREE.MeshStandardMaterial({ color: 0xfafcff, roughness: 0.95 });
            hill = new THREE.Mesh(hillGeometry, hillMaterial); hill.rotation.x = hillAngle; hill.position.set(0, -10, -hillLength / 2 + 500); scene.add(hill);
            playerGroup = new THREE.Group(); const bodyGeo = new THREE.BoxGeometry(1.3, 0.35, 2.1);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe11d48 }); const sledBody = new THREE.Mesh(bodyGeo, bodyMat); playerGroup.add(sledBody);
            scene.add(playerGroup); window.addEventListener('keydown', (e) => { if(e.key in keys) keys[e.key] = true; });
            window.addEventListener('keyup', (e) => { if(e.key in keys) keys[e.key] = false; });
            generateInitialTrees(); animate();
        }
        function createTreeElement(zPos) {
            const tree = new THREE.Group(); const trunkGeo = new THREE.CylinderGeometry(0.18, 0.28, 1.2, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x451a03 }); const trunk = new THREE.Mesh(trunkGeo, trunkMat); tree.add(trunk);
            const leaveMat = new THREE.MeshStandardMaterial({ color: 0x064e3b }); const coneGeo = new THREE.ConeGeometry(1.6, 2.5, 10);
            const cone = new THREE.Mesh(coneGeo, leaveMat); cone.position.y = 1.5; tree.add(cone);
            const xPos = (Math.random() - 0.5) * (hillWidth - 5); const yPos = (zPos * Math.tan(hillAngle)) - 10;
            tree.position.set(xPos, yPos, zPos); scene.add(tree); obstacles.push(tree);
        }
        function generateInitialTrees() { for (let i = 0; i < 45; i++) { createTreeElement(-120 - (i * 28)); } }
        function resetGame() {
            gameOver = false; score = 0; speed = 0.8; isJumping = false; velocityY = 0;
            document.getElementById("scoreVal").innerText = "0"; document.getElementById("screen-overlay").style.display = "none";
            playerGroup.position.set(0, 0, 0); obstacles.forEach(tree => scene.remove(tree)); obstacles = []; generateInitialTrees(); animate();
        }
        function animate() {
            if (gameOver) return; requestAnimationFrame(animate);
            let currentFloorY = (playerGroup.position.z * Math.tan(hillAngle)); playerGroup.position.z -= speed;
            if (!isJumping) { playerGroup.position.y = currentFloorY; }
            if (keys.ArrowLeft || keys.a) playerGroup.position.x -= sideSpeed; if (keys.ArrowRight || keys.d) playerGroup.position.x += sideSpeed;
            if (playerGroup.position.x < -18) playerGroup.position.x = -18; if (playerGroup.position.x > 18) playerGroup.position.x = 18;
            if (keys[' '] && !isJumping) { isJumping = true; velocityY = jumpForce; }
            if (isJumping) { velocityY += gravity; playerGroup.position.y += velocityY; if (playerGroup.position.y <= currentFloorY) { playerGroup.position.y = currentFloorY; isJumping = false; velocityY = 0; } }
            camera.position.set(playerGroup.position.x, playerGroup.position.y + 4.5, playerGroup.position.z + 9.5);
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 0.8, playerGroup.position.z - 6);
            for (let i = 0; i < obstacles.length; i++) {
                let tree = obstacles[i];
                if (tree.position.z > playerGroup.position.z + 15) {
                    tree.position.z = playerGroup.position.z - 1200; tree.position.x = (Math.random() - 0.5) * 35;
                    tree.position.y = (tree.position.z * Math.tan(hillAngle)) - 10; score++; document.getElementById("scoreVal").innerText = score; speed += 0.004;
                }
                let distX = Math.abs(playerGroup.position.x - tree.position.x); let distZ = Math.abs(playerGroup.position.z - tree.position.z);
                if (distX < 1.3 && distZ < 1.4 && (playerGroup.position.y - tree.position.y) < 2.4) { gameOver = true; document.getElementById("screen-overlay").style.display = "flex"; }
            }
            renderer.render(scene, camera);
        }
        window.onload = initEngine;
    </script>
</body>
</html>
