<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow Rider 3D - Console Edition</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        #cheat-bar {
            display: none;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 15, 30, 0.95);
            border: 2px solid #39ff14;
            border-radius: 6px;
            padding: 12px;
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.4);
            z-index: 9999;
            width: 450px;
        }
        #cheat-input {
            width: 78%;
            padding: 8px;
            background: #000;
            border: 1px solid #22c55e;
            color: #39ff14;
            font-size: 14px;
            font-family: monospace;
            border-radius: 4px;
            outline: none;
        }
        #cheat-btn {
            width: 18%;
            padding: 8px;
            background: #15803d;
            color: #39ff14;
            border: 1px solid #22c55e;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-family: monospace;
        }
        #cheat-msg {
            color: #4ade80;
            font-size: 12px;
            margin-top: 8px;
            text-align: left;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="cheat-bar">
        <input type="text" id="cheat-input" placeholder="Enter command...">
        <button id="cheat-btn" onclick="executeCheat()">EXEC</button>
        <div id="cheat-msg">
            [CONSOLE] Available commands:<br>
            • gifts [amount] | name [text] | setbest [score]<br>
            • noclip [on/off] | setplays [amount]<br>
            Close: Press Spacebar 5 times quickly
        </div>
    </div>

    <iframe id="game-frame" src="https://gamesroid.com" allowfullscreen></iframe>

    <script>
        let spaceCount = 0;
        let lastSpaceTime = 0;

        // Luister naar 5x snel achter elkaar Spatiebalk indrukken
        window.addEventListener('keydown', (e) => {
            // Als de balk al open is en je typt een spatie, moet hij niet sluiten
            if (document.activeElement === document.getElementById('cheat-input')) {
                return;
            }

            if (e.key === ' ' || e.key === 'Spacebar') {
                const currentTime = new Date().getTime();
                
                // Als de tijd tussen drukken korter is dan 400 milliseconden, tel door
                if (currentTime - lastSpaceTime < 400) {
                    spaceCount++;
                } else {
                    spaceCount = 1;
                }
                
                lastSpaceTime = currentTime;

                if (spaceCount === 5) {
                    e.preventDefault();
                    toggleCheatBar();
                    spaceCount = 0; // Reset de teller
                }
            }
        });

        function toggleCheatBar() {
            const bar = document.getElementById('cheat-bar');
            if (bar.style.display === 'block') {
                bar.style.display = 'none';
            } else {
                bar.style.display = 'block';
                document.getElementById('cheat-input').focus();
            }
        }

        function executeCheat() {
            const rawInput = document.getElementById('cheat-input').value;
            const input = rawInput.toLowerCase().trim();
            const msg = document.getElementById('cheat-msg');
            const iframe = document.getElementById('game-frame');
            
            const parts = input.split(' ');
            const command = parts[0];
            const argument = parts[1];

            try {
                const storage = iframe.contentWindow.localStorage;

                switch(command) {
                    case 'gifts':
                        const giftAmount = argument || '999';
                        storage.setItem('totalGift', giftAmount);
                        storage.setItem('gifts', giftAmount);
                        msg.innerHTML = "[OK] Gifts set to: " + giftAmount + ".<br>Click game and press Ctrl+Shift+R to apply.";
                        msg.style.color = "#4ade80";
                        break;

                    case 'name':
                        const newName = rawInput.substring(5).trim();
                        if (newName) {
                            storage.setItem('playerName', newName);
                            storage.setItem('username', newName);
                            msg.innerHTML = "[OK] Name changed to: '" + newName + "'.<br>Refresh the game.";
                            msg.style.color = "#4ade80";
                        } else {
                            msg.innerHTML = "[ERROR] No name entered. Use: name [text]";
                            msg.style.color = "#fca5a5";
                        }
                        break;

                    case 'setbest':
                        const bestScore = argument || '1000';
                        storage.setItem('bestScore', bestScore);
                        storage.setItem('highscore', bestScore);
                        msg.innerHTML = "[OK] Highscore set to: " + bestScore + ".<br>Refresh the game.";
                        msg.style.color = "#4ade80";
                        break;

                    case 'setplays':
                        const playsCount = argument || '100';
                        storage.setItem('totalPlays', playsCount);
                        storage.setItem('playCount', playsCount);
                        msg.innerHTML = "[OK] Play count set to: " + playsCount + ".";
                        msg.style.color = "#4ade80";
                        break;

                    case 'noclip':
                        if (argument === 'on') {
                            storage.setItem('godmode', 'true');
                            storage.setItem('invincible', 'true');
                            msg.innerHTML = "[OK] Noclip / Godmode activated.<br>Refresh game to test.";
                            msg.style.color = "#4ade80";
                        } else if (argument === 'off') {
                            storage.setItem('godmode', 'false');
                            storage.setItem('invincible', 'false');
                            msg.innerHTML = "[OK] Noclip disabled.";
                            msg.style.color = "#4ade80";
                        } else {
                            msg.innerHTML = "[ERROR] Use: noclip on OR noclip off";
                            msg.style.color = "#fca5a5";
                        }
                        break;

                    default:
                        msg.innerHTML = "[ERROR] Unknown command.<br>Available: gifts, name, setbest, setplays, noclip";
                        msg.style.color = "#fca5a5";
                }
            } catch(e) {
                msg.innerHTML = "[BEVEILIGING] Chromebook schoolbeveiliging blokkeert script-toegang tot de gameopslag.";
                msg.style.color = "#ef4444";
            }
            
            document.getElementById('cheat-input').value = '';
        }
    </script>
</body>
</html>
