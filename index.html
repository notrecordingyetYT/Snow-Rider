<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow Rider 3D - Chromebook Console</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        #cheat-bar {
            display: none;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 15, 30, 0.95);
            border: 2px solid #39ff14;
            border-radius: 6px;
            padding: 12px;
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.4);
            z-index: 9999;
            width: 450px;
        }
        #cheat-input {
            width: 78%;
            padding: 8px;
            background: #000;
            border: 1px solid #22c55e;
            color: #39ff14;
            font-size: 14px;
            font-family: monospace;
            border-radius: 4px;
            outline: none;
        }
        #cheat-btn {
            width: 18%;
            padding: 8px;
            background: #15803d;
            color: #39ff14;
            border: 1px solid #22c55e;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-family: monospace;
        }
        #cheat-msg {
            color: #4ade80;
            font-size: 12px;
            margin-top: 8px;
            text-align: left;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="cheat-bar">
        <input type="text" id="cheat-input" placeholder="Voer commando in...">
        <button id="cheat-btn" onclick="executeCheat()">EXEC</button>
        <div id="cheat-msg">
            [CONSOLE] Beschikbare commando's:<br>
            • gifts [aantal] | name [tekst] | setbest [score]<br>
            • noclip [on/off] | setplays [aantal]<br>
            Sluiten: Ctrl + Zoeken + Alt
        </div>
    </div>

    <iframe id="game-frame" src="https://gamesroid.com" allowfullscreen></iframe>

    <script>
        let keysPressed = {};

        // Luister naar Chromebook-specifieke toetsencombinatie (Ctrl + Meta/Zoeken + Alt)
        window.addEventListener('keydown', (e) => {
            keysPressed[e.key] = true;

            // 'Meta' is de Zoeken/Launcher-toets (met het vergrootglas of de cirkel) op een Chromebook
            if (keysPressed['Control'] && keysPressed['Meta'] && keysPressed['Alt']) {
                e.preventDefault();
                toggleCheatBar();
            }
        });

        window.addEventListener('keyup', (e) => {
            keysPressed[e.key] = false;
        });

        function toggleCheatBar() {
            const bar = document.getElementById('cheat-bar');
            if (bar.style.display === 'block') {
                bar.style.display = 'none';
            } else {
                bar.style.display = 'block';
                document.getElementById('cheat-input').focus();
            }
        }

        function executeCheat() {
            const rawInput = document.getElementById('cheat-input').value;
            const input = rawInput.toLowerCase().trim();
            const msg = document.getElementById('cheat-msg');
            const iframe = document.getElementById('game-frame');
            
            const parts = input.split(' ');
            const command = parts[0];
            const argument = parts[1];

            try {
                const storage = iframe.contentWindow.localStorage;

                switch(command) {
                    case 'gifts':
                        const giftAmount = argument || '999';
                        storage.setItem('totalGift', giftAmount);
                        storage.setItem('gifts', giftAmount);
                        msg.innerHTML = "[OK] Cadeautjes ingesteld op: " + giftAmount + ".<br>Ververs het spel om toe te passen.";
                        msg.style.color = "#4ade80";
                        break;

                    case 'name':
                        const newName = rawInput.substring(5).trim();
                        if (newName) {
                            storage.setItem('playerName', newName);
                            storage.setItem('username', newName);
                            msg.innerHTML = "[OK] Gebruikersnaam gewijzigd naar: '" + newName + "'.<br>Ververs het spel.";
                            msg.style.color = "#4ade80";
                        } else {
                            msg.innerHTML = "[FOUT] Geen naam opgegeven. Gebruik: name [naam]";
                            msg.style.color = "#fca5a5";
                        }
                        break;

                    case 'setbest':
                        const bestScore = argument || '1000';
                        storage.setItem('bestScore', bestScore);
                        storage.setItem('highscore', bestScore);
                        msg.innerHTML = "[OK] Highscore ingesteld op: " + bestScore + ".<br>Ververs het spel.";
                        msg.style.color = "#4ade80";
                        break;

                    case 'setplays':
                        const playsCount = argument || '100';
                        storage.setItem('totalPlays', playsCount);
                        storage.setItem('playCount', playsCount);
                        msg.innerHTML = "[OK] Aantal gespeelde potjes ingesteld op: " + playsCount + ".";
                        msg.style.color = "#4ade80";
                        break;

                    case 'noclip':
                        if (argument === 'on') {
                            storage.setItem('godmode', 'true');
                            storage.setItem('invincible', 'true');
                            msg.innerHTML = "[OK] Noclip / Godmode geactiveerd in opslag.<br>Ververs het spel om te proberen.";
                            msg.style.color = "#4ade80";
                        } else if (argument === 'off') {
                            storage.setItem('godmode', 'false');
                            storage.setItem('invincible', 'false');
                            msg.innerHTML = "[OK] Noclip / Godmode gedeactiveerd.";
                            msg.style.color = "#4ade80";
                        } else {
                            msg.innerHTML = "[FOUT] Gebruik: noclip on OF noclip off";
                            msg.style.color = "#fca5a5";
                        }
                        break;

                    default:
                        msg.innerHTML = "[FOUT] Onbekend commando. Beschikbaar:<br>gifts, name, setbest, setplays, noclip";
                        msg.style.color = "#fca5a5";
                }
            } catch(e) {
                msg.innerHTML = "[SYSTEM CRASH] De organisatiebeveiliging blokkeert opslagwijzigingen binnen dit iframe via scripts.";
                msg.style.color = "#ef4444";
            }
            
            document.getElementById('cheat-input').value = '';
        }
    </script>
</body>
</html>
